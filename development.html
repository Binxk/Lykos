<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lykos — in development</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #fff;
    color: #000;
    font-family: Menlo, monospace;
    font-size: 13px;
    line-height: 1.7;
    display: flex;
    flex-direction: column;
    cursor: crosshair;
  }
  a { color: #000; text-decoration: none; cursor: crosshair; }
  a:hover { color: #00f; }
  header { padding: 1.5rem 2rem; }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    padding: 2rem;
    min-height: 0;
  }
  pre#sprout {
    font-family: Menlo, monospace;
    line-height: 1.2;
    white-space: pre;
    user-select: none;
  }
  footer {
    display: flex;
    justify-content: center;
    gap: 3rem;
    padding: 1.25rem 0 1.5rem;
  }
  footer input {
    font: inherit;
    color: #000;
    background: #fff;
    border: 1px solid #000;
    width: 3ch;
    text-align: center;
    outline: none;
    cursor: text;
  }
</style>
</head>
<body>
<header>
  <a href="index.html">Lykos.</a>
</header>
<main>
  <pre id="sprout" aria-label="ASCII animation of a dog tilting its head"></pre>
  <p>in development</p>
</main>
<footer>
  <a href="about.html">about</a>
  <a href="#" id="contact">contact</a>
</footer>
<script src="contact.js"></script>
<script src="sprout_frames.js"></script>
<script>
  const el = document.getElementById("sprout");
  const { cols, rows, interval, frames } = window.SPROUT;

  function fit() {
    const box = el.parentElement.getBoundingClientRect();
    const w = box.width - 64, h = box.height - 120;
    const fs = Math.min(w / (cols * 0.602), h / (rows * 1.2), 8);
    el.style.fontSize = fs + "px";
  }
  window.addEventListener("resize", fit);
  fit();

  let i = 0;
  setInterval(() => {
    el.textContent = frames[i];
    i = (i + 1) % frames.length;
  }, interval);
</script>
</body>
</html>
